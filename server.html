<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Familienserver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* iOS-artiger Dark Mode */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: #1c1c1e;
            color: #f2f2f7;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
        }

        #modeToggle {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #2c2c2e;
            color: #0a84ff;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }

        section {
            background-color: #2c2c2e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        /* Upload-Button-Style */
        .upload-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .upload-row input[type="file"] {
            display: none;
        }

        .upload-row button {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .upload-row button:hover {
            background-color: #0077e0;
        }

        .upload-row #fileName {
            font-size: 0.9rem;
            color: #aaa;
            user-select: text;
            min-width: 120px;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            padding: 6px 0;
            border-bottom: 1px solid #3a3a3c;
        }

        a {
            color: #0a84ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        canvas {
            width: 100px !important;
            height: 100px !important;
        }

        .chart-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .chart-container {
            text-align: center;
            user-select: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>
            🗂️ Familienserver
            <button id="modeToggle" onclick="toggleMode()">🔄 Modus wechseln</button>
        </h1>

        <section>
            <h2>📤 Dateien/Ordner hochladen</h2>
            <div class="upload-row">
                <input type="file" id="fileInput" multiple webkitdirectory />
                <button onclick="document.getElementById('fileInput').click()">📁 Dateien/Ordner auswählen</button>
                <span id="fileName">Keine Dateien gewählt</span>
                <button onclick="uploadFiles()">⬆️ Hochladen</button>
            </div>
        </section>

        <section>
            <h2>📁 Dateien im Server</h2>
            <ul id="fileList">
                <li><em>Lade Daten…</em></li>
            </ul>
        </section>

        <section>
            <h2>📊 Systemauslastung</h2>
            <div class="chart-row">
                <div class="chart-container">
                    <canvas id="cpuChart"></canvas>
                    <p>CPU</p>
                </div>
                <div class="chart-container">
                    <canvas id="ramChart"></canvas>
                    <p>RAM</p>
                </div>
                <div class="chart-container">
                    <canvas id="diskChart"></canvas>
                    <p>Speicher</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        let devMode = true;
        let cpuChart, ramChart, diskChart;

        // Prüft ob Server erreichbar (Dateiliste)
        async function checkServerConnection() {
            try {
                const res = await fetch('/files', {cache: 'no-cache'});
                if (res.ok) {
                    devMode = false; // Server erreichbar → Produktivmodus
                    document.getElementById('modeToggle').textContent = '✅ Produktivmodus';
                    fetchFiles();
                    updateCharts();
                } else {
                    throw new Error('Server antwortet nicht OK');
                }
            } catch {
                // Server nicht erreichbar → Entwicklungsmodus
                devMode = true;
                document.getElementById('modeToggle').textContent = '🧪 Entwicklungsmodus';
                document.getElementById('fileList').innerHTML = '<li><em>Keine Verbindung zum Server</em></li>';
                updateCharts();
            }
        }

        function toggleMode() {
            devMode = !devMode;
            document.getElementById('modeToggle').textContent = devMode
                ? '🧪 Entwicklungsmodus'
                : '✅ Produktivmodus';

            if (!devMode) {
                fetchFiles();
                updateCharts();
            } else {
                document.getElementById('fileList').innerHTML = '<li><em>Keine Verbindung zum Server</em></li>';
                updateCharts();
            }
        }

        function getMockSystemInfo() {
            return {
                cpu: Math.random() * 100,
                ram_used: 40 + Math.random() * 40,
                disk_used: 30 + Math.random() * 60
            };
        }

        async function updateCharts() {
            let data;
            if (devMode) {
                data = getMockSystemInfo();
            } else {
                try {
                    const res = await fetch('/systeminfo');
                    data = await res.json();
                } catch (e) {
                    console.error('Fehler beim Laden von /systeminfo:', e);
                    return;
                }
            }

            if (!cpuChart) {
                createCharts(data.cpu, data.ram_used, data.disk_used);
            } else {
                updateChart(cpuChart, data.cpu);
                updateChart(ramChart, data.ram_used);
                updateChart(diskChart, data.disk_used);
            }
        }

        function createCharts(cpu, ram, disk) {
            const createConfig = (label, value, color) => ({
                type: 'doughnut',
                data: {
                    labels: [label, 'Frei'],
                    datasets: [{
                        data: [value, 100 - value],
                        backgroundColor: [color, '#3a3a3c'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '70%',
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            cpuChart = new Chart(document.getElementById('cpuChart'), createConfig('CPU', cpu, '#ff375f'));
            ramChart = new Chart(document.getElementById('ramChart'), createConfig('RAM', ram, '#32d74b'));
            diskChart = new Chart(document.getElementById('diskChart'), createConfig('Speicher', disk, '#ffd60a'));
        }

        function updateChart(chart, value) {
            chart.data.datasets[0].data[0] = value;
            chart.data.datasets[0].data[1] = 100 - value;
            chart.update();
        }

        async function fetchFiles() {
            try {
                const res = await fetch('/files');
                const files = await res.json();
                const list = document.getElementById('fileList');
                list.innerHTML = '';
                files.forEach(file => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '/download/' + encodeURIComponent(file);
                    link.textContent = file;
                    li.appendChild(link);
                    list.appendChild(li);
                });
            } catch {
                document.getElementById('fileList').innerHTML = '<li><em>Keine Verbindung zum Server</em></li>';
            }
        }

        async function uploadFiles() {
            const input = document.getElementById('fileInput');
            const files = input.files;
            if (!files.length) return alert('Bitte zuerst Dateien oder Ordner auswählen.');

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file, file.webkitRelativePath || file.name);
                try {
                    const res = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    if (!res.ok) throw new Error('Upload fehlgeschlagen');
                } catch (e) {
                    alert(`Fehler beim Hochladen der Datei: ${file.name}`);
                    console.error(e);
                }
            }
            if (!devMode) {
                fetchFiles();
            }
            document.getElementById('fileName').textContent = 'Keine Dateien gewählt';
            input.value = ''; // Reset input
        }

        // Anzeige gewählter Dateinamen aktualisieren
        document.getElementById('fileInput').addEventListener('change', function () {
            const files = this.files;
            if (!files.length) {
                document.getElementById('fileName').textContent = 'Keine Dateien gewählt';
                return;
            }
            if (files.length === 1) {
                document.getElementById('fileName').textContent = files[0].webkitRelativePath || files[0].name;
            } else {
                document.getElementById('fileName').textContent = `${files.length} Dateien ausgewählt`;
            }
        });

        // Beim Laden Verbindung prüfen und entsprechend Modus setzen
        checkServerConnection();
        setInterval(updateCharts, 5000);
    </script>
</body>
</html>
