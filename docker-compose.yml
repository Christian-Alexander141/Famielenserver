# Start:   mkdir -p data && docker compose up -d --build
# Danach:  http://<IP-des-Servers>:5000
#
# Das Passwort steht in der Datei .env (siehe .env.example).

services:
  familienserver:
    build: .
    container_name: familienserver
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Alle Familiendateien inkl. Papierkorb – hier liegt alles, was gesichert werden muss.
      - ./data:/data
    environment:
      FAMILIENSERVER_PASSWORD: ${FAMILIENSERVER_PASSWORD:?Bitte FAMILIENSERVER_PASSWORD in der Datei .env setzen}
      FAMILIENSERVER_TRASH_DAYS: ${FAMILIENSERVER_TRASH_DAYS:-30}
      FAMILIENSERVER_MAX_UPLOAD_MB: ${FAMILIENSERVER_MAX_UPLOAD_MB:-4096}
      FAMILIENSERVER_SECURE_COOKIES: ${FAMILIENSERVER_SECURE_COOKIES:-0}
      FAMILIENSERVER_TRUST_PROXY: ${FAMILIENSERVER_TRUST_PROXY:-0}
