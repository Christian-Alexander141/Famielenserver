version: '3.8'

services:
  familienserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familienserver
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "3000:3000"
    volumes:
      - ./familienserver/public/uploads:/app/familienserver/public/uploads
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
    networks:
      - familienserver-network

networks:
  familienserver-network:
    driver: bridge

volumes:
  familienserver-uploads:
