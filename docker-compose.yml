version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: familienserver-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./familienserver/public/uploads:/app/familienserver/public/uploads
    networks:
      - familienserver-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: familienserver-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./familienserver/public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - familienserver-network

networks:
  familienserver-network:
    driver: bridge
