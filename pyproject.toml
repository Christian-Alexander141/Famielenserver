[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "familienserver"
version = "2.0.0"
description = "Familienserver – Dateien für das Heimnetzwerk (Flask-Backend)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0,<4",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
    # Vorschaubilder für Fotos. Fehlt Pillow, zeigt das Frontend Symbole.
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Installation (im Projektordner):
#   pip install -e .          Betrieb
#   pip install -e ".[dev]"   inkl. Tests
[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
